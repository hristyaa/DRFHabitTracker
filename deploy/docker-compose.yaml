services:
    db:
      image: postgres:15.1-alpine
      environment:
        POSTGRES_DB: ${POSTGRES_DB}
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      volumes:
        - postgres_data:/var/lib/postgresql/data/
      ports:
        - "${POSTGRES_PORT}:5432"
      healthcheck:
        test: pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
        interval: 3s
        timeout: 3s
        retries: 10

    redis:
      image: redis:7
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 1s
        timeout: 1s
        retries: 5

    backend:
      build: .
      command: bash -c "python manage.py migrate && python manage.py collectstatic -c --no-input && python manage.py runserver 0.0.0.0:8000"
      env_file:
        - .env
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy
      volumes:
        - django_static:/app/staticfiles/

    web:
      image: nginx:1.19.3
      ports:
        - "80:80"
      depends_on:
        backend:
          condition: service_started
      volumes:
        - ./nginx.conf:/etc/nginx/conf.d/default.conf
        - django_static:/app/staticfiles/

    celery:


volumes:
  postgres_data:
  django_static:
